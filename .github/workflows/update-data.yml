name: Scheduled Data Update

on:
  schedule:
    # Run every day at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-leaderboard-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run automated leaderboard data adapters
        run: npx tsx scripts/fetch/run-adapters.ts
        continue-on-error: true # Ensure failure in third-party fetch doesn't block CI

      - name: Validate data schemas
        run: npm run validate:data

      - name: Check for dataset changes
        id: git-check
        run: |
          git status --porcelain
          if [ -n "$(git status --porcelain data/)" ]; then
            echo "changes=true" >> $GITHUB_OUTPUT
          else
            echo "changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push updated snapshots
        if: steps.git-check.outputs.changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "chore(data): auto-update leaderboard snapshots [skip ci]"
          git push
